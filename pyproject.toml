[project]
name = "forklab-workspace"
version = "0.1.0"
description = "Rehearse a warehouse decision before changing the warehouse"
requires-python = ">=3.12"
dependencies = [
    "forklab-domain",
    "forklab-evaluation",
    "forklab-api",
    "forklab-worker",
    "forklab-cli",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
forklab-domain = { workspace = true }
forklab-evaluation = { workspace = true }
forklab-api = { workspace = true }
forklab-worker = { workspace = true }
forklab-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI expresses uploads as `File(...)` defaults; that is the framework idiom.
"services/api/forklab_api/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
