[project]
name = "forklab-worker"
version = "0.1.0"
description = "ForkLab durable job runner with leases and checkpoints"
requires-python = ">=3.12"
dependencies = ["forklab-api", "forklab-domain", "forklab-evaluation"]

[project.scripts]
forklab-worker = "forklab_worker.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forklab_worker"]

[tool.uv.sources]
forklab-api = { workspace = true }
forklab-domain = { workspace = true }
forklab-evaluation = { workspace = true }
