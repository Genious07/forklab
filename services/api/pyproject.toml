[project]
name = "forklab-api"
version = "0.1.0"
description = "ForkLab control plane: imports, scenarios, experiments, comparisons"
requires-python = ">=3.12"
dependencies = [
    "forklab-domain",
    "forklab-evaluation",
    "forklab-cli",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forklab_api"]

[tool.uv.sources]
forklab-domain = { workspace = true }
forklab-evaluation = { workspace = true }
forklab-cli = { workspace = true }
