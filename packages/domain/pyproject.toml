[project]
name = "forklab-domain"
version = "0.1.0"
description = "Deterministic warehouse simulator, policies, and invariants"
requires-python = ">=3.12"
dependencies = ["simpy>=4.1", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forklab_domain"]
