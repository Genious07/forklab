[project]
name = "forklab-evaluation"
version = "0.1.0"
description = "Independent metrics and paired comparison for ForkLab experiments"
requires-python = ">=3.12"
dependencies = ["forklab-domain", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forklab_eval"]

[tool.uv.sources]
forklab-domain = { workspace = true }
